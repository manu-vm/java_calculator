<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101915">
<meta name="description" content="A simple, responsive Java calculator for everyday arithmetic.">
<title>Java Calculator</title>
<style>
:root{color-scheme:light;--page:#ddd;--frame:#f3f3f3;--screen:#bfbfbf;--text:#202020;--line:#9a9a9a}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:14px;background:var(--page);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:min(576px,calc(100vw - 20px))}
.window{width:100%;height:min(630px,calc(100svh - 20px));min-height:470px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #aaa;border-radius:16px 16px 3px 3px;background:var(--frame);box-shadow:0 4px 18px #0003}
.titlebar{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #d0d0d0;background:linear-gradient(#fafafa,#e9e9e9);font-size:17px;font-weight:700}
.window-controls{position:absolute;right:9px;top:50%;display:flex;gap:8px;transform:translateY(-50%);color:#666;font-size:14px}
.window-controls span{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#e1e1e1}
.display{height:100px;flex:0 0 100px;margin:12px 4.2% 0;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;overflow:hidden;background:var(--screen);border:1px solid #b4b4b4}
.expression{width:100%;min-height:18px;color:#484848;font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.output{width:100%;margin-top:0;color:#111;font-variant-numeric:tabular-nums;font-size:clamp(38px,11vw,64px);font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:clip}
.keys{flex:1;min-height:0;display:grid;grid-template-columns:20.15% 20.34% 20.15% 19.01% 15.59%;grid-template-rows:repeat(4,minmax(0,1fr));row-gap:12px;margin:12px 4.2% 16px}
button{min-width:0;width:100%;height:100%;border:2px solid #91aabd;border-radius:1px;background:linear-gradient(#fff 0%,#f5f9fd 34%,#dceaf5 100%);color:#292929;font:700 clamp(38px,11vw,64px)/1 Arial,Helvetica,sans-serif;cursor:pointer;box-shadow:inset 0 1px #fff;touch-action:manipulation}
button:hover{background:linear-gradient(#fff 0%,#edf5fb 34%,#cbdff0 100%)}
button:active{background:linear-gradient(#cbdff0,#f5f9fd);box-shadow:inset 0 2px 5px #38516a55}
button:focus-visible{outline:3px solid #235a91;outline-offset:2px}
button.utility{grid-column:4 / 6;width:calc(100% + 3.23%);margin-left:17%;font-size:16px}
button.operator{font-size:clamp(30px,7vw,46px)}
button.operator:nth-of-type(8),button.operator:nth-of-type(13){grid-column:4;width:calc(100% + 17%);margin-left:17%}
button.operator:nth-of-type(9),button.operator:nth-of-type(14){grid-column:5;width:calc(100% + 25%);margin-left:30.5%}
button.equals{grid-column:3 / 6;width:calc(100% + 5.3%);margin-left:10.5%;font-size:clamp(30px,7vw,46px)}
.hint{margin:9px 0 0;color:#555;font-size:12px;text-align:center}
@media(max-width:600px){body{padding:10px}.window{height:min(630px,calc(100svh - 20px));min-height:450px}.display{height:clamp(70px,14vh,100px);flex-basis:clamp(70px,14vh,100px)}.keys{row-gap:clamp(7px,2vh,12px);margin-bottom:12px}button.utility{font-size:15px}.hint{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
  <section class="window" aria-label="Calculator window">
    <div class="titlebar"><span>Calculator</span><div class="window-controls" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div></div>
    <div class="display" role="status" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <output class="output" id="output" aria-label="Display">0</output>
    </div>
    <div class="keys">
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="utility" data-action="clear" aria-label="Clear">Clear</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="operator" data-op="+" aria-label="Add">+</button><button class="operator" data-op="*" aria-label="Multiply">X</button>
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="operator" data-op="-" aria-label="Subtract">-</button><button class="operator" data-op="/" aria-label="Divide">÷</button>
      <button data-digit="0">0</button><button data-digit=".">.</button><button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </section>
  <p class="hint">Use the buttons or your keyboard · Esc clears · Enter calculates</p>
</main>
<script>
'use strict';
const output=document.getElementById('output');
const expression=document.getElementById('expression');
let current='0',stored=null,operator=null,resetOnDigit=false,justCalculated=false;
const symbols={'+':'+','-':'−','*':'×','/':'÷'};
function clean(n){if(!Number.isFinite(n))return null;return Number.parseFloat(n.toPrecision(12)).toString()}
function paint(){output.textContent=current;expression.textContent=expression.textContent}
function inputDigit(d){
 if(current==='Error'){clearAll()}
 if(d==='.'&&current.includes('.')&&!resetOnDigit)return;
 if(resetOnDigit){current=d==='.'?'0.':d;resetOnDigit=false}
 else if(d==='.')current=current.includes('.')?current:current+'.';
 else current=current==='0'?d:current+d;
 if(current.replace(/[-.]/g,'').length>15)current=current.slice(0,-1);
 justCalculated=false;paint()
}
function calculate(a,b,op){
 if(op==='+')return a+b;if(op==='-')return a-b;if(op==='*')return a*b;if(op==='/')return b===0?null:a/b;return b
}
function chooseOperator(next){
 if(current==='Error')return;
 const value=Number(current);
 if(operator&&stored!==null&&!resetOnDigit){const result=calculate(stored,value,operator);if(result===null){showError();return}current=clean(result);stored=Number(current)}
 else stored=value;
 operator=next;expression.textContent=clean(stored)+' '+symbols[next];resetOnDigit=true;justCalculated=false;paint()
}
function equals(){
 if(operator===null||stored===null||current==='Error')return;
 const left=stored,right=Number(current),op=operator,result=calculate(left,right,op);
 if(result===null){showError();return}
 expression.textContent=clean(left)+' '+symbols[op]+' '+clean(right)+' =';current=clean(result);stored=null;operator=null;resetOnDigit=true;justCalculated=true;paint()
}
function showError(){current='Error';expression.textContent='Cannot divide by zero';stored=null;operator=null;resetOnDigit=true;paint()}
function clearAll(){current='0';stored=null;operator=null;resetOnDigit=false;justCalculated=false;expression.textContent='';paint()}
function action(name){
 if(name==='clear'){clearAll();return}
 if(current==='Error')return;
 if(name==='sign'){if(current!=='0')current=current.startsWith('-')?current.slice(1):'-'+current;paint()}
 if(name==='percent'){current=clean(Number(current)/100)||'0';paint()}
 if(name==='equals')equals()
}
document.querySelector('.keys').addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.digit!==undefined)inputDigit(button.dataset.digit);
 else if(button.dataset.op)chooseOperator(button.dataset.op);
 else if(button.dataset.action)action(button.dataset.action)
});
document.addEventListener('keydown',event=>{
 if(/^[0-9.]$/.test(event.key)){inputDigit(event.key);event.preventDefault();return}
 const op=event.key==='x'||event.key==='X'?'*':event.key;
 if(['+','-','*','/'].includes(op)){chooseOperator(op);event.preventDefault();return}
 if(event.key==='Enter'||event.key==='='){equals();event.preventDefault();return}
 if(event.key==='Escape'){clearAll();return}
 if(event.key==='Backspace'&&current!=='Error'){current=current.length<=1||current.length===2&&current.startsWith('-')?'0':current.slice(0,-1);paint();event.preventDefault()}
});
paint();
</script>
</body>
</html>
